[project]
name = "oauth-mcp-server"
version = "0.1.0"
description = "FastMCP server with Azure Active Directory Bearer token authentication"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "httpx>=0.27.0",
    "msal>=1.26.0",
    "PyJWT[crypto]>=2.8.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.30.0",
]

[project.scripts]
oauth-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["."]
include = ["server.py"]
