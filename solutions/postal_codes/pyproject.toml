[project]
name = "postal-codes"
version = "0.1.0"
description = "FastMCP server for querying Norwegian postal codes from the mcpdemo database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "psycopg[binary]>=3.0",
]

[project.scripts]
postal-codes = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["."]
include = ["server.py"]
