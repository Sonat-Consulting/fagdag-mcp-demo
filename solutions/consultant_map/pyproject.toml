[project]
name = "consultant-map"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.7",
    "openai>=1.40.0",
    "psycopg[binary]>=3.0",
    "uvicorn>=0.30",
]

[project.scripts]
consultant-map-server = "server:main"
consultant-map-client = "client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "client.py", "index.html"]
